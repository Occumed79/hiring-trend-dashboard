      - key: SOURCE_HISTORY_RETENTION_DAYS
        value: "180"
      - key: SOURCE_PAIR_BASELINE_DAYS
        value: "30"
      - key: SOURCE_PAIR_MIN_SAMPLES
        value: "5"
      - key: BENCHMARK_ENTITIES_PER_PORTAL
