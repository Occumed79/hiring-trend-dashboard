services:
  - type: web
    name: hiring-trend-dashboard
    env: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: ADZUNA_APP_ID
        sync: false
      - key: ADZUNA_APP_KEY
        sync: false
      - key: USAJOBS_API_KEY
        sync: false
      - key: USAJOBS_USER_AGENT
        sync: false
      - key: USAJOBS_RESULTS_PER_PAGE
        value: "500"
      - key: USAJOBS_MAX_PAGES
        value: "20"
      - key: SAM_API_KEY
        sync: false
      - key: CONTRACTOR_IDENTITY_STALE_DAYS
        value: "30"
      - key: SOURCE_DISCOVERY_STALE_DAYS
        value: "14"
      - key: ENTITY_SOURCE_CONCURRENCY
        value: "4"
      - key: SOURCE_CHECK_STALE_HOURS
        value: "48"
      - key: LANGSEARCH_API_KEY
        sync: false
      - key: LANGSEARCH_API_KEY_2
        sync: false
      - key: LANGSEARCH_MODE
        value: always
      - key: LANGSEARCH_FRESHNESS
        value: oneMonth
      - key: LANGSEARCH_TIMEOUT_MS
        value: "12000"
      - key: THEIRSTACK_API_KEY
        sync: false
      - key: THEIRSTACK_API_KEY_2
        sync: false
      - key: THEIRSTACK_API_KEY_3
        sync: false
      - key: THEIRSTACK_API_KEY_4
        sync: false
      - key: THEIRSTACK_API_KEY_5
        sync: false
      - key: THEIRSTACK_COMPANY_SWEEP_LOOKBACK_DAYS
        value: "30"
      - key: THEIRSTACK_COMPANY_SWEEP_INTERVAL_DAYS
        value: "14"
      - key: THEIRSTACK_API_CREDIT_RESERVE
        value: "20"
      - key: THEIRSTACK_TIMEOUT_MS
        value: "15000"
      - key: THEIRSTACK_LEGACY_JOB_SEARCH_ENABLED
        value: "false"
      - key: THEIRSTACK_EXPORT_WEBHOOK_SECRET
        sync: false
      - key: KEENABLE_API_KEY
        sync: false
      - key: CLARIFAI_PAT
        sync: false
      - key: CLARIFAI_MODEL_URL
        value: https://clarifai.com/qwen/qwenLM/models/Qwen3-30B-A3B-Instruct-2507
      - key: CLARIFAI_MAX_JOBS_PER_RUN
        value: "12"
      - key: CLARIFAI_TIMEOUT_MS
        value: "20000"
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: GROQ_MODEL
        value: openai/gpt-oss-20b
      - key: GROQ_TIMEOUT_MS
        value: "15000"
      - key: GROQ_MAX_FALLBACKS_PER_RUN
        value: "6"
      - key: ALGOLIA_APP_ID
        sync: false
      - key: ALGOLIA_SEARCH_API_KEY
        sync: false
      - key: ALGOLIA_WRITE_API_KEY
        sync: false
      - key: ALGOLIA_INDEX_NAME
        value: hiring_jobs
      - key: NLX_API_KEY
        sync: false
      - key: NLX_API_KEY_HEADER
        value: X-API-Key
      - key: NLX_API_BASE_URL
        value: https://api.nlxresearchhub.com/v2/jobs
      - key: NLX_LOOKBACK_DAYS
        value: "30"
      - key: NLX_STATE_PARAM
        value: state
      - key: NLX_EMPLOYER_PARAM
        value: employer
      - key: NLX_EXPIRED_PARAM
        value: expired
      - key: NLX_PAGE_PARAM
        value: page
      - key: NLX_CURSOR_PARAM
        value: cursor
      - key: NLX_PAGE_SIZE
        value: "50"
      - key: NLX_MAX_PAGES
        value: "40"
      - key: CAREERONESTOP_API_TOKEN
        sync: false
      - key: CAREERONESTOP_USER_ID
        sync: false
      - key: CAREERONESTOP_API_BASE_URL
        value: https://api.careeronestop.org
      - key: CAREERONESTOP_PAGE_SIZE
        value: "100"
      - key: CAREERONESTOP_MAX_PAGES
        value: "20"
      - key: CAREERONESTOP_DAYS
        value: "60"
      - key: JOB_API_TOKEN
        sync: false
      - key: JOB_API_MODE
        value: fallback
      - key: JOB_API_FALLBACK_MIN_EXISTING
        value: "1"
      - key: JOB_API_ADAPTERS
        value: jsearch
      - key: JOB_API_COUNTRY
        value: us
      - key: JOB_API_LIMIT
        value: "25"
      - key: JOB_API_DATE_POSTED
        value: month
      - key: JOB_API_TIMEOUT_MS
        value: "12000"
      - key: INGEST_HTTP_TIMEOUT_MS
        value: "10000"
      - key: INGEST_RECONCILE_DISCOVERY
        value: "true"
      - key: INGEST_UPSERT_CONCURRENCY
        value: "4"
      - key: JOB_STALE_AFTER_DAYS
        value: "30"
      - key: GEOAPIFY_API_KEY
        sync: false
      - key: GEOCODE_MAX_PER_PROCESS
        value: "100"
      - key: CRON_SECRET
        generateValue: true
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_ARCGIS_API_KEY
        sync: false

  - type: cron
    name: daily-ingest
    env: node
    buildCommand: npm install && node scripts/migrate.js
    schedule: "0 6 * * *"
    startCommand: >-
      node scripts/sync-government-registry.js --if-stale || true;
      node scripts/sync-source-directories.js --if-stale || true;
      node scripts/enrich-association-job-urls.js || true;
      node scripts/ingest.js &&
      { node scripts/rebuild-source-pair-baselines.js || true; node scripts/run-benchmarks.js --scheduled || true; }
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: CENSUS_GOVERNMENT_REGISTRY_YEAR
        value: "2025"
      - key: CENSUS_GOVERNMENT_REGISTRY_URL
        value: https://www2.census.gov/programs-surveys/gus/datasets/2025/gov_units_2025.zip
      - key: CENSUS_GOVERNMENT_REGISTRY_STALE_DAYS
        value: "30"
      - key: CENSUS_GOVERNMENT_REGISTRY_BATCH_SIZE
        value: "250"
      - key: SOURCE_DIRECTORY_STALE_DAYS
        value: "14"
      - key: SOURCE_DIRECTORY_TIMEOUT_MS
        value: "20000"
      - key: ASSOCIATION_DISCOVERY_STALE_DAYS
        value: "30"
      - key: ASSOCIATION_DISCOVERY_CONCURRENCY
        value: "6"
      - key: ASSOCIATION_DISCOVERY_TIMEOUT_MS
        value: "12000"
      - key: SOURCE_DISCOVERY_STALE_DAYS
        value: "14"
      - key: ENTITY_SOURCE_CONCURRENCY
        value: "4"
      - key: SOURCE_CHECK_STALE_HOURS
