      - key: BENCHMARK_JOB_STALE_DAYS
        value: "30"
      - key: BENCHMARK_TRUTH_MAX_AGE_HOURS
        value: "36"
      - key: BENCHMARK_MIN_ENTITIES
        value: "5"
      - key: BENCHMARK_MIN_TRUTH_ENTITIES
        value: "3"
      - key: BENCHMARK_MIN_PRECISION
        value: "0.98"
      - key: BENCHMARK_MIN_RECALL
        value: "0.90"
      - key: BENCHMARK_MIN_PARITY
        value: "0.90"
      - key: BENCHMARK_MAX_DUPLICATE_RATE
        value: "0.01"
      - key: BENCHMARK_MAX_STALE_RATE
        value: "0.03"
      - key: BENCHMARK_MIN_MAPPED_RATE
        value: "0.85"
      - key: BENCHMARK_MIN_AUTHORITATIVE_HEALTH
